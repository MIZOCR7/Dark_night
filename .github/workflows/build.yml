name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac-arm64
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygame pyinstaller

      - name: Build
        shell: bash
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          FLAGS="--onefile"
          if [ "$RUNNER_OS" = "macOS" ]; then FLAGS=""; fi
          pyinstaller $FLAGS --windowed --name DarkNight \
            --add-data "assets${SEP}assets" --add-data "audio${SEP}audio" \
            --add-data "font.otf${SEP}." --add-data "map_data.json${SEP}." main.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DarkNight.exe -DestinationPath DarkNight-windows.zip

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/DarkNight.app DarkNight-mac-arm64.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf DarkNight-linux.tar.gz -C dist DarkNight

      - uses: actions/upload-artifact@v4
        with:
          name: DarkNight-${{ matrix.name }}
          path: |
            DarkNight-windows.zip
            DarkNight-mac-arm64.zip
            DarkNight-linux.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
